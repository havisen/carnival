server {
    listen 80;
    server_name carnival.carni.lol;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/carnival-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://carnival.carni.lol$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name carnival.carni.lol;

    ssl_certificate /etc/letsencrypt/live/carnival.carni.lol/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carnival.carni.lol/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 21m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
